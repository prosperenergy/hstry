<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Chat Topics</title><link rel="stylesheet" href="/style.css"><script defer src="/app.js"></script></head>
<body>
<aside><div class="brand">MY CHAT TOPICS</div><p class="muted">Your work, in one place.</p><nav id="topics" aria-label="Topics"></nav><button id="new-topic">+ Add a topic</button><div class="sidebar-bottom"><button id="refresh">Refresh history</button><p id="freshness" class="muted"></p></div></aside>
<main><header><div><p class="eyebrow">HISTORY + CONTINUITY</p><h1 id="heading">All conversations</h1><p id="coverage" class="muted"></p></div><span class="pill">Private · On this Mac</span></header>
<div id="notice" role="status" aria-live="polite"></div>
<form id="search-form"><label class="sr-only" for="search">Search imported message text</label><input id="search" placeholder="Find a name, decision, or phrase…" autocomplete="off"><button type="submit">Search history</button><button id="clear-search" type="button" class="secondary">Clear</button></form>
<section id="topic-panel" hidden><div class="panel-top"><div><h2>Continue this topic</h2><p id="canonical" class="muted"></p></div><div id="continue" class="actions"></div></div><div id="native-sources"></div><p id="brief-state" class="muted"></p><label for="brief">Current status, decisions, unfinished work, and next step</label><textarea id="brief" rows="5" placeholder="Save a current brief after reviewing the source conversations below."></textarea><p class="muted">Choose source conversations below before saving. Historical messages do not establish current status.</p><div class="actions"><button id="save-brief">Save brief</button><button id="copy-context" class="secondary">Copy context for my AI</button><button id="native-plan" class="secondary">App organization status</button></div></section>
<section><div class="panel-top"><h2 id="list-heading">Conversations</h2><span id="result-count" class="muted"></span></div><div id="chats"></div><button id="more" hidden>Load more conversations</button></section>
<dialog id="detail"><div class="panel-top"><h2 id="detail-title">Source messages</h2><button id="close-detail" class="secondary">Close</button></div><div id="detail-content"></div><button id="more-messages" hidden>Load more messages</button></dialog>
</main></body></html>
